<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>宝贝的学习周历 ⭐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;background:#FFF5FB;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,#FFB6D9 1.2px,transparent 1.2px);background-size:28px 28px;opacity:.15;pointer-events:none;z-index:0}
.header{background:linear-gradient(135deg,#FFB6D9 0%,#CDB4F8 55%,#A8D8FF 100%);padding:14px 16px 16px;position:relative;overflow:hidden;z-index:1}
.hdeco{position:absolute;top:8px;right:14px;font-size:18px;opacity:.4;letter-spacing:4px;pointer-events:none}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hleft{display:flex;align-items:center;gap:8px}
.hicon{font-size:26px}
.htitle{font-size:19px;font-weight:900;color:#fff;text-shadow:0 2px 8px rgba(180,80,150,.25)}
.wnav{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.32);border-radius:20px;padding:5px 10px}
.nbtn{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:0 2px;line-height:1;font-weight:700}
.nbtn:disabled{opacity:.25;cursor:default}
.hdate{font-size:12px;font-weight:700;color:#fff;white-space:nowrap;min-width:90px;text-align:center}
.etoolbar{display:none;position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#FF9FCE,#C9B8FF);padding:10px 16px;align-items:center;justify-content:space-between}
.etoolbar.show{display:flex}
.elabel{color:#fff;font-size:14px;font-weight:700}
.tbtns{display:flex;gap:8px}
.tbtn{padding:7px 16px;border-radius:20px;border:none;font-size:13px;font-weight:700;cursor:pointer}
.tbtn-c{background:rgba(255,255,255,.28);color:#fff}
.tbtn-s{background:#fff;color:#C084FC}
.cwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:12px 10px 110px;position:relative;z-index:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:8px;min-width:830px}
.dcol{display:flex;flex-direction:column;gap:7px}
.dhdr{text-align:center;padding:9px 5px 7px;background:#fff;border-radius:15px;box-shadow:0 2px 8px rgba(200,100,180,.1);border:2px solid transparent}
.dhdr.wknd{border-color:#FFB6D9;background:#FFF0F6}
.dhdr.today{background:linear-gradient(135deg,#FF9FCE,#C9B8FF)}
.dname{font-size:14px;font-weight:800;color:#111}
.dname.w{color:#FF6B8A}
.dhdr.today .dname,.dhdr.today .ddate{color:#fff}
.ddate{font-size:11px;color:#bbb;margin-top:2px}
.card{border-radius:13px;padding:9px 11px;font-size:13px;position:relative}
.c-daily{background:#FFFBEA;border:2px dashed #FBBF24}
.dlbl{font-size:11px;font-weight:800;color:#F59E0B;margin-bottom:5px}
.ditem{font-size:12px;color:#666;line-height:1.7;padding-left:2px}
.c-school{background:linear-gradient(135deg,#FFB347,#FF9F43);color:#fff}
.c-class{background:linear-gradient(135deg,#F472B6,#C084FC);color:#fff}
.c-holiday{background:linear-gradient(135deg,#FF8FAB,#FF6B8A);color:#fff;min-height:50px}
.c-travel{background:linear-gradient(135deg,#60C8F5,#38B6FF);color:#fff}
.c-free{background:#fff;border:1.5px solid #F9C8E0;color:#888}
.c-cancelled{background:#F5F5F5;border:1.5px dashed #DDD;color:#C0C0C0}
.cbadge{display:inline-block;background:#E8E8E8;color:#C0C0C0;font-size:10px;border-radius:8px;padding:1px 6px;margin-top:3px}
.ctime{font-size:11px;font-weight:700;opacity:.88;margin-bottom:3px}
.cmain{display:flex;align-items:center;gap:5px}
.cicon{font-size:15px;flex-shrink:0}
.ctitle{font-weight:700;font-size:13px;line-height:1.3}
.csub{font-size:11px;opacity:.85;margin-top:2px}
.cebar{position:absolute;top:4px;right:4px;display:flex;gap:3px}
.cebtn{width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.2);color:#fff}
.addbtn{background:#fff;border:1.5px dashed #FFB6D9;color:#FF9FCE;border-radius:13px;padding:7px;font-size:12px;font-weight:700;cursor:pointer;width:100%;margin-top:2px}
.fabs{position:fixed;bottom:22px;right:14px;display:flex;flex-direction:column;gap:9px;z-index:50}
.fab{width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.18);transition:transform .15s}
.fab:active{transform:scale(.9)}
.f-share{background:linear-gradient(135deg,#67D948,#52C41A)}
.f-ai{background:linear-gradient(135deg,#FAAD14,#FFC53D)}
.f-hist{background:linear-gradient(135deg,#A8D8FF,#60C8F5)}
.f-edit{background:linear-gradient(135deg,#FFB6D9,#C9B8FF)}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:100;align-items:flex-end}
.ov.open{display:flex}
.sheet{background:#fff;border-radius:22px 22px 0 0;padding:12px 16px 30px;width:100%;max-height:88vh;overflow-y:auto}
.shdl{width:34px;height:4px;background:#E8D5EE;border-radius:2px;margin:0 auto 12px}
.shtitle{font-size:16px;font-weight:800;color:#333;margin-bottom:6px}
.shhint{font-size:12px;color:#AAA;line-height:1.6;margin-bottom:10px}
.sbtns{display:flex;gap:8px;margin-top:10px}
.sbtn{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer}
.sb-c{background:#F5F5F5;color:#999}
.sb-p{background:linear-gradient(135deg,#FFB6D9,#C9B8FF);color:#fff}
.sb-y{background:linear-gradient(135deg,#FAAD14,#FFC53D);color:#fff}
.flbl{font-size:12px;font-weight:700;color:#888;margin-bottom:4px;margin-top:8px}
input,textarea{width:100%;border:2px solid #F3D0E8;border-radius:11px;padding:9px 12px;font-size:14px;outline:none;color:#555;font-family:inherit}
input:focus,textarea:focus{border-color:#C9B8FF}
textarea{height:110px;font-size:13px;line-height:1.6;resize:vertical;display:block}
.tpills{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px;-webkit-overflow-scrolling:touch}
.tp{flex-shrink:0;padding:6px 12px;border-radius:20px;border:2px solid #EEE;font-size:12px;font-weight:700;cursor:pointer;color:#888;background:#fff}
.tp.on{border-color:transparent;color:#fff}
.tp[data-t=daily_tasks].on{background:#FBBF24}
.tp[data-t=school].on{background:#FF9F43}
.tp[data-t=class].on{background:#C084FC}
.tp[data-t=holiday].on{background:#FF6B8A}
.tp[data-t=travel].on{background:#38B6FF}
.tp[data-t=free].on{background:#AAA}
.tp[data-t=cancelled].on{background:#BBB}
.icrow{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px;-webkit-overflow-scrolling:touch}
.icopt{font-size:22px;cursor:pointer;padding:3px;border-radius:8px;flex-shrink:0}
.icopt.sel,.icopt:hover{background:#F3D0E8}
.hist-item{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-radius:13px;background:#FFF5FB;border:1.5px solid #F3D0E8;margin-bottom:7px;cursor:pointer}
.hist-item.cur{background:linear-gradient(135deg,#FFE9F3,#EDE9FF);border-color:#C9B8FF}
.hist-range{font-size:14px;font-weight:700;color:#555}
.hist-tag{font-size:11px;color:#C084FC;font-weight:700;margin-top:2px}
.hist-del{background:none;border:none;font-size:16px;cursor:pointer;padding:4px 6px;border-radius:8px;flex-shrink:0}
.hist-add{width:100%;padding:11px;border-radius:13px;border:2px dashed #FFB6D9;background:#fff;color:#FF9FCE;font-size:13px;font-weight:700;cursor:pointer;margin-top:2px}
.pbox{background:#F9F0FF;border:1.5px solid #E0D0FF;border-radius:12px;padding:12px;font-size:11px;color:#555;line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow-y:auto}
.token-hint{background:#FFF8E1;border:1.5px solid #FFE082;border-radius:11px;padding:11px;font-size:12px;color:#888;line-height:1.6;margin-bottom:10px}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:rgba(40,40,40,.82);color:#fff;padding:9px 20px;border-radius:20px;font-size:13px;display:none;z-index:300;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{display:block}
</style>
</head>
<body>

<div class="header">
  <div class="hdeco">⭐🌈🎀✨🌸</div>
  <div class="hrow">
    <div class="hleft"><span class="hicon">🌟</span><span class="htitle" id="appTitle">宝贝的学习周历</span></div>
    <div class="wnav">
      <button class="nbtn" id="btnPrev" onclick="goWeek(-1)">‹</button>
      <span class="hdate" id="dateRange">—</span>
      <button class="nbtn" id="btnNext" onclick="goWeek(1)">›</button>
    </div>
  </div>
</div>

<div class="etoolbar" id="etb">
  <span class="elabel">✏️ 编辑模式</span>
  <div class="tbtns">
    <button class="tbtn tbtn-c" onclick="cancelEdit()">取消</button>
    <button class="tbtn tbtn-s" onclick="saveEdit()" id="savebtn">保存</button>
  </div>
</div>

<div class="cwrap"><div class="cal" id="cal"></div></div>

<div class="fabs">
  <button class="fab f-share" onclick="share()"      title="分享">🔗</button>
  <button class="fab f-ai"    onclick="openAI()"     title="AI提示词" style="display:none">🤖</button>
  <button class="fab f-hist"  onclick="openHist()"   title="历史">📅</button>
  <button class="fab f-edit"  onclick="toggleEdit()" title="编辑" id="fabEdit" style="display:none">✏️</button>
</div>

<!-- 历史 -->
<div class="ov" id="ovHist" onclick="bgc(event,'ovHist')">
  <div class="sheet">
    <div class="shdl"></div>
    <div class="shtitle">📅 历史周记录</div>
    <div id="histList"></div>
    <button class="hist-add" onclick="addWeek()">＋ 创建下一周（自动复制本周结构）</button>
  </div>
</div>

<!-- 事件表单 -->
<div class="ov" id="ovForm" onclick="bgc(event,'ovForm')">
  <div class="sheet">
    <div class="shdl"></div>
    <div class="shtitle" id="formTitle">添加活动</div>
    <div class="tpills" id="tpills"></div>
    <input type="hidden" id="fType"/>
    <div id="fldItems"><div class="flbl">每日任务（每行一条）</div><textarea id="fItems" placeholder="英语托托&#10;数学题打卡&#10;默写高手"></textarea></div>
    <div id="fldTime"><div class="flbl">时间</div><input id="fTime" placeholder="15:20"/></div>
    <div id="fldTitle"><div class="flbl">标题</div><input id="fTitle" placeholder="学校放学"/></div>
    <div id="fldSub"><div class="flbl">副标题</div><input id="fSub" placeholder="猫头鹰"/></div>
    <div id="fldIcon"><div class="flbl">图标（点击或手动输入）</div><div class="icrow" id="icrow"></div><input id="fIcon" placeholder="🏫" style="margin-top:6px"/></div>
    <div class="sbtns">
      <button class="sbtn sb-c" onclick="closeOv('ovForm')">取消</button>
      <button class="sbtn sb-p" onclick="saveForm()">确定 ✨</button>
    </div>
  </div>
</div>

<!-- Token -->
<div class="ov" id="ovToken" onclick="bgc(event,'ovToken')">
  <div class="sheet">
    <div class="shdl"></div>
    <div class="shtitle">🔑 编辑验证</div>
    <div class="token-hint">编辑日程需要 GitHub Token，输入一次后自动记住。</div>
    <div class="flbl">Personal Access Token</div>
    <input id="tokenInput" type="password" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"/>
    <div class="sbtns">
      <button class="sbtn sb-c" onclick="closeOv('ovToken')">取消</button>
      <button class="sbtn sb-p" onclick="confirmToken()">确认并开始编辑</button>
    </div>
  </div>
</div>

<!-- AI 提示词 -->
<div class="ov" id="ovAI" onclick="bgc(event,'ovAI')">
  <div class="sheet">
    <div class="shdl"></div>
    <div class="shtitle">🤖 AI 生成提示词</div>
    <div class="shhint">复制后发给 Claude，得到 JSON 后告诉 Claude 更新日程。</div>
    <div class="pbox" id="pbox"></div>
    <div class="sbtns">
      <button class="sbtn sb-c" onclick="closeOv('ovAI')">关闭</button>
      <button class="sbtn sb-y" onclick="copyAI()">复制提示词 📋</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

// ═══ 状态 ═══
let all=null, vi=0, editing=false, snap=null, pDay=0, pEv=-1;
const getToken=()=>localStorage.getItem('gh_token')||'';
const setToken=t=>localStorage.setItem('gh_token',t);

// ═══ 日期工具 ═══
function weekDates(s){const b=new Date(s+'T00:00:00');return Array.from({length:7},(_,i)=>{const d=new Date(b);d.setDate(d.getDate()+i);return d;})}
function fmtRange(dates){const s=dates[0],e=dates[6],[sm,sd,em,ed]=[s.getMonth()+1,s.getDate(),e.getMonth()+1,e.getDate()];return sm===em?`${sm}月${sd}-${ed}日`:`${sm}月${sd}日-${em}月${ed}日`}
function isToday(d){const t=new Date();return d.getDate()===t.getDate()&&d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear()}
function findCurWeek(){const today=new Date();today.setHours(0,0,0,0);for(let i=0;i<all.weeks.length;i++){const ws=new Date(all.weeks[i].weekStart+'T00:00:00'),we=new Date(ws);we.setDate(we.getDate()+6);if(today>=ws&&today<=we)return i}return all.weeks.length-1}

// ═══ 渲染 ═══
function render(){
  const wk=editing?snap:all.weeks[vi];
  if(!wk)return;
  const dates=weekDates(wk.weekStart);
  document.getElementById('dateRange').textContent=fmtRange(dates);
  document.getElementById('appTitle').textContent=wk.title||'宝贝的学习周历';
  document.getElementById('btnPrev').disabled=vi<=0;
  document.getElementById('btnNext').disabled=vi>=all.weeks.length-1;
  const cal=document.getElementById('cal');cal.innerHTML='';
  dates.forEach((date,i)=>{
    const wknd=i>=5,col=document.createElement('div');col.className='dcol';
    const hdr=document.createElement('div');
    hdr.className='dhdr'+(wknd?' wknd':'')+(isToday(date)?' today':'');
    hdr.innerHTML=`<div class="dname${wknd?' w':''}">${DAYS[i]}</div><div class="ddate">${date.getMonth()+1}/${date.getDate()}</div>`;
    col.appendChild(hdr);
    (wk.days[i]?.events||[]).forEach((ev,ei)=>col.appendChild(mkCard(ev,i,ei)));
    if(editing){const ab=document.createElement('button');ab.className='addbtn';ab.textContent='＋ 添加活动';ab.onclick=()=>openForm(i,-1);col.appendChild(ab)}
    cal.appendChild(col);
  });
}

function mkCard(ev,di,ei){
  const el=document.createElement('div');
  if(ev.type==='daily_tasks'){
    el.className='card c-daily';
    el.innerHTML=`<div class="dlbl">✅ 每日必做</div>`+(ev.items||[]).map(x=>`<div class="ditem">• ${x}</div>`).join('');
  }else{
    const c={school:'c-school',class:'c-class',holiday:'c-holiday',travel:'c-travel',free:'c-free',cancelled:'c-cancelled'}[ev.type]||'c-free';
    el.className=`card ${c}`;
    let h=ev.time?`<div class="ctime">${ev.time}</div>`:'';
    h+=`<div class="cmain">${ev.icon?`<span class="cicon">${ev.icon}</span>`:''}<span class="ctitle">${ev.title||''}</span></div>`;
    if(ev.subtitle)h+=`<div class="csub">${ev.subtitle}</div>`;
    if(ev.type==='cancelled')h+=`<span class="cbadge">本周停课</span>`;
    el.innerHTML=h;
  }
  if(editing){const bar=document.createElement('div');bar.className='cebar';bar.innerHTML=`<button class="cebtn" onclick="openForm(${di},${ei})">✏️</button><button class="cebtn" onclick="delEv(${di},${ei})">🗑</button>`;el.appendChild(bar)}
  return el;
}

// ═══ 周切换 ═══
function goWeek(d){vi=Math.max(0,Math.min(all.weeks.length-1,vi+d));render()}

// ═══ 编辑 ═══
function toggleEdit(){editing?cancelEdit():startEdit()}
function startEdit(){editing=true;snap=JSON.parse(JSON.stringify(all.weeks[vi]));document.getElementById('etb').classList.add('show');document.getElementById('fabEdit').textContent='❌';render()}
function cancelEdit(){editing=false;snap=null;document.getElementById('etb').classList.remove('show');document.getElementById('fabEdit').textContent='✏️';render()}

async function saveEdit(){
  if(!getToken()){openOv('ovToken');return}
  await doSave();
}

async function doSave(){
  const btn=document.getElementById('savebtn');
  try{
    btn.textContent='保存中…';btn.disabled=true;
    all.weeks[vi]=JSON.parse(JSON.stringify(snap));
    await pushBoth();
    editing=false;snap=null;
    document.getElementById('etb').classList.remove('show');
    document.getElementById('fabEdit').textContent='✏️';
    render();toast('已保存，家人刷新链接即可看到 🎉');
  }catch(e){
    if(e.message==='NO_TOKEN'){openOv('ovToken');return}
    toast('保存失败：'+e.message);
  }finally{btn.textContent='保存';btn.disabled=false}
}

async function pushBoth(){
  const tok=getToken();if(!tok)throw new Error('NO_TOKEN');
  const hdr={'Authorization':`token ${tok}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'};

  // 更新 schedule.json
  const jApi=`${API}/schedule.json`;
  const jInfo=await fetch(jApi,{headers:hdr}).then(r=>r.json());
  await fetch(jApi,{method:'PUT',headers:hdr,body:JSON.stringify({
    message:`更新宝贝的学习周历 ${new Date().toLocaleDateString('zh-CN')}`,
    content:btoa(unescape(encodeURIComponent(JSON.stringify(all,null,2)))),
    sha:jInfo.sha
  })});

  // 更新 index.html（替换嵌入数据）
  const hApi=`${API}/index.html`;
  const hInfo=await fetch(hApi,{headers:hdr}).then(r=>r.json());
  const curHtml=decodeURIComponent(escape(atob(hInfo.content.replace(/\n/g,''))));
  const newHtml=curHtml.replace(/\/\* @DATA@ \*\/[\s\S]*?\/\* @DATA@ \*\//,`/* @DATA@ */ ${JSON.stringify(all)} /* @DATA@ */`);
  const res=await fetch(hApi,{method:'PUT',headers:hdr,body:JSON.stringify({
    message:`更新宝贝的学习周历 ${new Date().toLocaleDateString('zh-CN')}`,
    content:btoa(unescape(encodeURIComponent(newHtml))),
    sha:hInfo.sha
  })});
  if(!res.ok){const e=await res.json();throw new Error(e.message||'提交失败')}
}

function confirmToken(){
  const t=document.getElementById('tokenInput').value.trim();
  if(!t){toast('请输入 Token');return}
  setToken(t);closeOv('ovToken');doSave();
}

// ═══ 事件表单 ═══
function initUI(){
  document.getElementById('tpills').innerHTML=TYPES.map(t=>`<button class="tp" data-t="${t.v}" onclick="selType('${t.v}')">${t.l}</button>`).join('');
  document.getElementById('icrow').innerHTML=ICONS.map(ic=>`<span class="icopt" onclick="pickIc('${ic}')">${ic}</span>`).join('');
}

function openForm(di,ei){
  pDay=di;pEv=ei;
  document.getElementById('formTitle').textContent=ei>=0?'编辑活动':'添加活动';
  const ev=ei>=0?snap.days[di].events[ei]:{type:'school'};
  selType(ev.type||'school',false);
  document.getElementById('fTime').value=ev.time||'';
  document.getElementById('fTitle').value=ev.title||'';
  document.getElementById('fSub').value=ev.subtitle||'';
  document.getElementById('fIcon').value=ev.icon||'';
  document.getElementById('fItems').value=(ev.items||[]).join('\n');
  openOv('ovForm');
}

function selType(t,fill=true){
  document.querySelectorAll('.tp').forEach(p=>p.classList.toggle('on',p.dataset.t===t));
  document.getElementById('fType').value=t;
  const noTime=['daily_tasks','holiday','free'],hasSub=['class','holiday','travel','cancelled'],noIcon=['daily_tasks','free'];
  document.getElementById('fldItems').style.display=t==='daily_tasks'?'block':'none';
  document.getElementById('fldTime').style.display=noTime.includes(t)?'none':'block';
  document.getElementById('fldTitle').style.display=t==='daily_tasks'?'none':'block';
  document.getElementById('fldSub').style.display=hasSub.includes(t)?'block':'none';
  document.getElementById('fldIcon').style.display=noIcon.includes(t)?'none':'block';
  if(fill){const d={school:{title:'学校放学',icon:'🏫'},class:{icon:'🎵'},travel:{icon:'🚄'},free:{title:'自由安排'},cancelled:{icon:'🎨'}}[t]||{};if(d.title)document.getElementById('fTitle').value=d.title;if(d.icon)document.getElementById('fIcon').value=d.icon}
}

function pickIc(ic){document.getElementById('fIcon').value=ic;document.querySelectorAll('.icopt').forEach(e=>e.classList.toggle('sel',e.textContent===ic))}

function saveForm(){
  const type=document.getElementById('fType').value,ev={type};
  if(type==='daily_tasks'){ev.items=document.getElementById('fItems').value.split('\n').map(s=>s.trim()).filter(Boolean)}
  else{const t=document.getElementById('fTime').value.trim(),ti=document.getElementById('fTitle').value.trim(),su=document.getElementById('fSub').value.trim(),ic=document.getElementById('fIcon').value.trim();if(t)ev.time=t;if(ti)ev.title=ti;if(su)ev.subtitle=su;if(ic)ev.icon=ic}
  if(!snap.days[pDay])snap.days[pDay]={events:[]};
  if(pEv>=0)snap.days[pDay].events[pEv]=ev;else snap.days[pDay].events.push(ev);
  closeOv('ovForm');render();
}

function delEv(di,ei){snap.days[di].events.splice(ei,1);render();toast('已删除')}

// ═══ 历史 ═══
function openHist(){renderHist();openOv('ovHist')}
function renderHist(){
  const list=document.getElementById('histList');list.innerHTML='';
  all.weeks.slice().reverse().forEach((wk,ri)=>{
    const idx=all.weeks.length-1-ri,item=document.createElement('div');
    item.className='hist-item'+(idx===vi?' cur':'');
    item.innerHTML=`<div><div class="hist-range">${fmtRange(weekDates(wk.weekStart))}</div>${idx===vi?'<div class="hist-tag">📍 当前查看</div>':''}</div><button class="hist-del" onclick="delWeek(event,${idx})">🗑️</button>`;
    item.onclick=e=>{if(e.target.classList.contains('hist-del'))return;vi=idx;closeOv('ovHist');render()};
    list.appendChild(item);
  });
}

function addWeek(){
  const last=all.weeks[all.weeks.length-1],d=new Date(last.weekStart+'T00:00:00');d.setDate(d.getDate()+7);
  const nw=JSON.parse(JSON.stringify(last));nw.weekStart=d.toISOString().slice(0,10);
  nw.days.forEach(day=>{day.events=day.events.filter(ev=>!['holiday','travel'].includes(ev.type))});
  all.weeks.push(nw);vi=all.weeks.length-1;closeOv('ovHist');render();toast('已创建下周，修改后保存即可同步');startEdit();
}

function delWeek(e,idx){
  e.stopPropagation();
  if(all.weeks.length<=1){toast('至少保留一周');return}
  all.weeks.splice(idx,1);if(vi>=all.weeks.length)vi=all.weeks.length-1;
  renderHist();render();
}

// ═══ AI 提示词 ═══
function openAI(){
  const wk=all.weeks[vi],d=new Date(wk.weekStart+'T00:00:00');d.setDate(d.getDate()+7);
  const ns=d.toISOString().slice(0,10);
  document.getElementById('pbox').textContent=`请帮我生成从 ${ns} 开始的下一周学习周历 JSON。\n\n参考当前周：\n${JSON.stringify(wk,null,2)}\n\n只返回 JSON，格式同上，weekStart 改为 "${ns}"，days 共7个元素对应周一到周日。`;
  openOv('ovAI');
}

function openOv(id){document.getElementById(id).classList.add('open')}
function closeOv(id){document.getElementById(id).classList.remove('open')}
function bgc(e,id){if(e.target===document.getElementById(id))closeOv(id)}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800)}
